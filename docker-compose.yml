name: m2a

services:
  postgres:
    profiles: [db]
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    security_opt:
      - apparmor=unconfined
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diagrams_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - m2a-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    profiles: [api]
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    security_opt:
      - apparmor=unconfined
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://postgres:password@host.docker.internal:5433/diagrams_db?schema=public
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    networks:
      - m2a-network
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  web:
    profiles: [web]
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    init: true
    stop_grace_period: 5s
    security_opt:
      - apparmor=unconfined
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - m2a-network

volumes:
  postgres_data:

networks:
  m2a-network:
    driver: bridge
