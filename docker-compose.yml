name: m2a

services:
  postgres:
    profiles: [db]
    image: postgres:16-alpine
    container_name: diagrams_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diagrams_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - m2a-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  db-init:
    profiles: [db]
    build:
      context: .
      dockerfile: apps/api/prisma/Dockerfile.db-init
    network_mode: "service:postgres"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: localhost
      DATABASE_URL: postgresql://postgres:password@localhost:5432/diagrams_db?schema=public
    restart: "no"

  pgadmin:
    profiles: [db]
    image: dpage/pgadmin4
    container_name: diagrams_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - m2a-network

  api:
    profiles: [api]
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: m2a_api
    restart: unless-stopped
    env_file: apps/api/.env
    ports:
      - "3000:3000"
    networks:
      - m2a-network
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  web:
    profiles: [web]
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: m2a_web
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - m2a-network

volumes:
  postgres_data:

networks:
  m2a-network:
    driver: bridge
