name: m2a

services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    env_file: apps/api/.env
    ports:
      - "3000:3000"
    networks:
      - m2a-network
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - m2a-network

  postgres:
    image: postgres:16-alpine
    container_name: diagrams_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diagrams_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - m2a-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: diagrams_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - m2a-network

volumes:
  postgres_data:

networks:
  m2a-network:
    driver: bridge
