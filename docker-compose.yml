name: m2a

services:
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    restart: unless-stopped
    env_file: apps/api/.env
    ports:
      - "3000:3000"
    networks:
      - m2a-network

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - m2a-network

networks:
  m2a-network:
    driver: bridge
